<!-- @dsCard group="Type" viewport="700x180" name="Mono & eyebrow — JetBrains Mono" subtitle="Technical accents, labels, code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--background); padding: 28px; font-family: var(--font-body); color: var(--text-body); }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }
  code { font-family: var(--font-mono); font-size: 14px; color: var(--brand-teal); background: var(--surface-elevated); border:1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
  .price { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
  .pz { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="eyebrow">// Full-stack · AI · Enterprise</div>
  <p><code>const stack = ['React', 'TypeScript', 'Node']</code></p>
  <p class="price"><span class="pz">od</span> <span class="in-gradient-text--cta in-gradient-text">1699&nbsp;zł</span></p>
</body>
</html>
