<!-- @dsCard group="Colors" viewport="700x150" name="Neutral scale" subtitle="shadcn slate (hue 240) — 50 → 950" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--background); padding: 24px; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .sw { height: 56px; border-radius: var(--radius); border: 1px solid var(--border); }
  .lab { margin-top: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-align:center; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="sw" style="background:var(--slate-50)"></div><div class="lab">50</div></div>
    <div><div class="sw" style="background:var(--slate-100)"></div><div class="lab">100</div></div>
    <div><div class="sw" style="background:var(--slate-200)"></div><div class="lab">200</div></div>
    <div><div class="sw" style="background:var(--slate-300)"></div><div class="lab">300</div></div>
    <div><div class="sw" style="background:var(--slate-400)"></div><div class="lab">400</div></div>
    <div><div class="sw" style="background:var(--slate-500)"></div><div class="lab">500</div></div>
    <div><div class="sw" style="background:var(--slate-600)"></div><div class="lab">600</div></div>
    <div><div class="sw" style="background:var(--slate-700)"></div><div class="lab">700</div></div>
    <div><div class="sw" style="background:var(--slate-800)"></div><div class="lab">800</div></div>
    <div><div class="sw" style="background:var(--slate-900)"></div><div class="lab">900</div></div>
    <div><div class="sw" style="background:var(--slate-950)"></div><div class="lab">950</div></div>
  </div>
</body>
</html>
