<!-- @dsCard group="Type" viewport="700x190" name="Gradient heading treatment" subtitle="The signature: clipped brand gradient on display type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--background); padding: 28px; font-family: var(--font-display); }
  h2 { font-size: var(--text-5xl); font-weight: 800; letter-spacing: var(--tracking-tight); line-height: 1.05; margin: 0 0 8px; }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); margin-top: 14px; }
</style>
</head>
<body>
  <h2 class="in-gradient-text">Liczby, które mówią same za siebie</h2>
  <h2 class="in-gradient-text--logo in-gradient-text" style="font-size:var(--text-4xl)">Interactive</h2>
  <div class="note">.in-gradient-text (blue→purple→pink) · .in-gradient-text--logo (spectrum)</div>
</body>
</html>
