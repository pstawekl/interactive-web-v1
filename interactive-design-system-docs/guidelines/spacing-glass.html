<!-- @dsCard group="Spacing" viewport="700x200" name="Glass & blur" subtitle="Overlay cards — translucency + backdrop blur" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-body); background:
    radial-gradient(circle at 20% 30%, rgba(147,51,234,0.5), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(37,99,235,0.5), transparent 40%),
    var(--background); }
  .glass { width: 280px; padding: 20px; border-radius: var(--radius-2xl);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow-xl); color: var(--text-body); }
  .t { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .s { font-size: 13px; color: var(--text-muted); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="glass">
    <div class="t">Bezpieczeństwo</div>
    <div class="s">Zgodność z RODO/GDPR, certyfikaty SSL, regularne backupy.</div>
  </div>
  <div class="lab">.in-glass · --glass-bg · --blur 10px</div>
</body>
</html>
