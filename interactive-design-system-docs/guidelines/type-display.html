<!-- @dsCard group="Type" viewport="700x300" name="Display — Space Grotesk" subtitle="Headings · geometric, technical, tightened" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--background); padding: 28px; font-family: var(--font-display); color: var(--text-body); }
  .row { display:flex; align-items:baseline; gap:16px; margin-bottom: 10px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); margin-left:auto; white-space:nowrap; }
  .d { font-weight: 700; letter-spacing: var(--tracking-tight); line-height:1.05; }
</style>
</head>
<body>
  <div class="row"><span class="d" style="font-size:var(--text-6xl)">Aa</span><span class="d" style="font-size:var(--text-4xl)">Interactive</span><span class="meta">700 · -0.015em</span></div>
  <div class="row"><span class="d" style="font-size:var(--text-5xl)">Rozwiązania IT</span><span class="meta">48 / 5xl</span></div>
  <div class="row"><span class="d" style="font-size:var(--text-4xl); font-weight:800;">Proste rozwiązania</span><span class="meta">36 / 4xl · 800</span></div>
  <div class="row"><span class="d" style="font-size:var(--text-2xl); font-weight:600;">Czego szukasz?</span><span class="meta">24 / 2xl · 600</span></div>
</body>
</html>
