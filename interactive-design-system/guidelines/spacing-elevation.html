<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation & glow" subtitle="Neutral shadows + reserved brand glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--background); padding: 30px; font-family: var(--font-body); }
  .row { display:flex; gap: 26px; align-items:center; flex-wrap:wrap; }
  .item { text-align:center; }
  .box { width: 96px; height: 64px; background: var(--surface-elevated); border:1px solid var(--border); border-radius: var(--radius-xl); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 12px; }
  .cta { background: var(--gradient-cta); border: none; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow)"></div><div class="lab">shadow</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">shadow-md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">shadow-lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-2xl)"></div><div class="lab">shadow-2xl</div></div>
    <div class="item"><div class="box cta" style="box-shadow:var(--glow-cta)"></div><div class="lab">glow-cta</div></div>
  </div>
</body>
</html>
